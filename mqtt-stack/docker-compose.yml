services:
  mqtt:
    build: .
    container_name: mqtt-broker
    # restart: unless-stopped
    environment:
      - MQTT_USERNAME=mqtt
      - MQTT_PASSWORD=lasdpc
      - ALLOW_ANONYMOUS=false
      - MQTT_PORT=1883
      - WS_ENABLED=true
      - WS_PORT=9001
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto-data:/mosquitto/data
      - ./mosquitto-log:/mosquitto/log

  db:
    container_name: influxdb3-core
    image: influxdb:3-core
    user: "root"
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
    environment:
      - INFLUXDB3_AUTH_TOKEN=${INFLUXDB3_AUTH_TOKEN}
      - INFLUXDB3_DATABASE_NAME=${INFLUXDB3_DATABASE_NAME}
    ports:
      - "8181:8181"
    volumes:
      - influxdb3-data:/var/lib/influxdb3/data

  telegraf:
    container_name: telegraf
    image: telegraf:1.38-alpine
    depends_on:
      - db
      - mqtt
    environment:
      - INFLUXDB3_AUTH_TOKEN=${INFLUXDB3_AUTH_TOKEN}
      - INFLUXDB3_DATABASE_NAME=${INFLUXDB3_DATABASE_NAME}
    volumes:
      - ./config/telegraf.conf:/etc/telegraf/telegraf.conf:ro

volumes:
  influxdb3-data:
