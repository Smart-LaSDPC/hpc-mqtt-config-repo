[agent]
  interval = "5s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "5s"
  flush_jitter = "0s"
  precision = "1s"
  hostname = "telegraf"
  omit_hostname = true

# ======================================
# ENTRADA: Suscripción al Broker MQTT
# ======================================
[[inputs.mqtt_consumer]]
  servers = ["tcp://mqtt:1883"]
  username = "mqtt"
  password = "lasdpc"

  topics = [
    "lab1006/sensor/temperature/SensorTemperature",
  ]
  
  topic_tag = "topic"
  data_format = "json"
  name_override = "sensor_temperature"

  tag_keys = ["type", "id", "agent_monitor_id"]
  json_string_fields = ["date_time", "mqtt_client_id"]

[[inputs.mqtt_consumer]]
  servers = ["tcp://mqtt:1883"]
  topics = ["lab1006/sensor/presence/SensorPresence"]
  username = "mqtt"
  password = "lasdpc"

  topic_tag = "topic"
  data_format = "json"
  name_override = "sensor_presence"

  tag_keys = [
    "type",
    "id",
    "agent_monitor_id",
    "presence_id_user",
    "presence_rol"
  ]
  json_string_fields = ["date_time", "mqtt_client_id"]
# ======================================
# SALIDA: Escritura en InfluxDB 3 Core
# ======================================
[[outputs.influxdb_v3]]
  urls = ["http://db:8181"]
  token = "${INFLUXDB3_AUTH_TOKEN}"
  database = "${INFLUXDB3_DATABASE_NAME}"
